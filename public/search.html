<body>

<script>
(function(){
  // The eighteenth cleanup (SITE-ORDER\EIGHTEENTH-CLEANUP, Part D): Search reads each writing's whole text, its subjects, kind and year,
  // the Marks drawings' titles and every Marks group; a word matches where a word begins, in its single
  // or plural form; several words in any order; best matches first; catalogue numbers with marks
  // around them; both apostrophes the same; a short hand-kept list of everyday words.
  var PAGE_SIZE = 20;
  var shown = 0;
  var idx = null;
  var text = null;
  var box = document.getElementById('search-box');
  var out = document.getElementById('search-results');

  function fold(s){
    return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/['\u2018\u2019\u02bc]/g,'');
  }
  function wordsOf(s){
    return fold(s).split(/[^\p{L}\p{N}]+/u).filter(function(w){ return w; });
  }
  function hay(s){ return ' ' + wordsOf(s).join(' '); }

  // The single and plural forms of a word.
  function variants(t){
    var v = [t];
    if (t.length > 3){
      if (/ies$/.test(t)) v.push(t.slice(0,-3) + 'y');
      else if (/(ches|shes|xes|sses)$/.test(t)) v.push(t.slice(0,-2));
      else if (/s$/.test(t) && !/ss$/.test(t)) v.push(t.slice(0,-1));
      if (/[^aeiou]y$/.test(t)) v.push(t.slice(0,-1) + 'ies');
    }
    return v;
  }
  function hasStart(h, v){ return h.indexOf(' ' + v) !== -1; }

  function prepare(){
    var i, r;
    for (i=0;i<idx.pages.length;i++){
      r = idx.pages[i];
      r._t = hay(r.t); r._o = ''; r._k = 0; r._i = i;
    }
    for (i=0;i<idx.galleries.length;i++){
      r = idx.galleries[i];
      r._t = hay(r.t); r._o = ''; r._k = 1; r._i = i;
    }
    idx.drawings = [];
    for (i=0;i<idx.explicit.length;i++){
      var ex = idx.explicit[i];
      if (ex.h.indexOf('/marks/') !== 0 || !ex.m) continue;
      idx.drawings.push({t: ex.m, h: ex.h, k: 'Picture', s: 'Marks drawing · Catalogue ' + ex.n.padStart(5, '0'), _t: hay(ex.m), _o: '', _k: 4, _i: i});
    }
    for (i=0;i<idx.writings.length;i++){
      r = idx.writings[i];
      r._t = hay(r.t);
      r._o = hay([r.d, r.x, r.a, r.s, (r.j||[]).join(' ')].join(' '));
      r._k = 3; r._i = i; r._w = i;
    }
    var all = idx.pages.concat(idx.writings);
    for (i=0;i<all.length;i++){
      if (all[i].y) all[i]._y = all[i].y.split(' | ').map(function(p){ return wordsOf(p).join(' '); });
    }
  }

  // Writings whose whole text holds a word beginning with v (from search-words.json).
  var textCache = {};
  function textHolds(v){
    if (!text) return null;
    if (textCache[v]) return textCache[v];
    var keys = text.k, lo = 0, hi = keys.length;
    while (lo < hi){ var mid = (lo + hi) >> 1; if (keys[mid] < v) lo = mid + 1; else hi = mid; }
    var set = {};
    for (var i=lo;i<keys.length && keys[i].indexOf(v) === 0;i++){
      var parts = text.p[i].split('.'), at = 0;
      for (var j=0;j<parts.length;j++){ at += parseInt(parts[j], 16); set[at] = true; }
    }
    textCache[v] = set;
    return set;
  }

  function tokenIn(r, t){
    var vs = variants(t);
    for (var i=0;i<vs.length;i++){
      if (hasStart(r._t, vs[i]) || hasStart(r._o, vs[i])) return true;
      if (r._w !== undefined){
        var set = textHolds(vs[i]);
        if (set && set[r._w]) return true;
      }
    }
    return false;
  }

  function rank(r, tokens, phrase){
    if (r._y && r._y.indexOf(phrase) !== -1) return 1;
    var tw = r._t.slice(1);
    var vs = tokens.length === 1 ? variants(phrase) : [phrase];
    for (var i=0;i<vs.length;i++){ if (tw === vs[i]) return 2; }
    for (i=0;i<vs.length;i++){ if (tw.indexOf(vs[i]) === 0) return 3; }
    var inTitle = tokens.every(function(t){
      return variants(t).some(function(v){ return hasStart(r._t, v); });
    });
    if (inTitle) return 4;
    var inLines = tokens.every(function(t){
      return variants(t).some(function(v){ return hasStart(r._t, v) || hasStart(r._o, v); });
    });
    return inLines ? 5 : 6;
  }

  function numberMatches(n){
    var results = [];
    for (var i=0;i<idx.ranges.length;i++){
      var r = idx.ranges[i];
      if (n >= r.s && n <= r.e){
        var pos = String(n - r.s + r.sp).padStart(r.w, '0');
        results.push({t: String(n).padStart(5, '0'), h: r.h + pos + '.html', k: 'Picture'});
      }
    }
    for (var j=0;j<idx.explicit.length;j++){
      if (idx.explicit[j].n === String(n)){
        var ex = idx.explicit[j];
        results.push({t: (ex.m ? ex.m + ' · ' : '') + ex.n.padStart(5, '0'), h: ex.h, k: 'Picture'});
      }
    }
    return results;
  }

  function search(qRaw){
    var raw = qRaw.trim();
    var results = [];
    var num = raw.match(/^(?:#|no\.?|number|catalogue|catalog)?\s*#?\s*(\d+)$/i);
    if (num) results = numberMatches(parseInt(num[1], 10));
    var tokens = wordsOf(raw);
    if (!tokens.length) return results;
    var phrase = tokens.join(' ');
    if (num && num[0] !== num[1]) return results;
    var need = tokens.filter(function(t){ return t.length > 1; });
    if (!need.length) need = tokens;
    var pools = [idx.pages, idx.galleries, idx.drawings, idx.writings];
    var found = [];
    for (var p=0;p<pools.length;p++){
      var pool = pools[p];
      for (var i=0;i<pool.length;i++){
        var r = pool[i];
        var everyday = r._y && r._y.indexOf(phrase) !== -1;
        if (!everyday){
          var ok = true;
          for (var t=0;t<need.length;t++){ if (!tokenIn(r, need[t])) { ok = false; break; } }
          if (!ok) continue;
        }
        var rk = rank(r, tokens, phrase);
        if (r._k === 4 && rk === 3) rk = 4;  // a drawing's title that only begins with the words waits for the writings
        found.push({r: r, rank: rk});
      }
    }
    found.sort(function(a,b){
      return (a.rank - b.rank) || (a.r._k - b.r._k) ||
        (a.r._k >= 3 ? a.r.t.length - b.r.t.length : 0) || (a.r._i - b.r._i);
    });
    return results.concat(found.map(function(x){
      var r = x.r;
      if (r._k === 0) return {t: r.t, h: r.h, k: 'Page', s: r.s};
      if (r._k === 1) return {t: r.t, h: r.h, k: 'Gallery', s: r.s};
      return r;
    }));
  }

  function render(results, q){
    if (!results.length){
      out.innerHTML = '<p class="search-empty">Nothing found. Try another word, or a catalogue number.</p>';
      return;
    }
    var slice = results.slice(0, shown);
    var rows = slice.map(function(r){
      var meta = r.s ? escapeHtml(r.s) : r.k;
      if (r.k === 'Song' && r.a) meta += ', ' + escapeHtml(r.a);
      if ((r.k === 'Writing' || r.k === 'Song' || r.k === 'Question') && r.d) {
        meta += ' &middot; ' + escapeHtml(r.d);
      }
      return '<a class="search-row" href="' + r.h + '"><span class="search-row-title">' + escapeHtml(r.t) + '</span><span class="search-row-meta">' + meta + '</span></a>';
    }).join('');
    var more = results.length > shown ? '<a href="#" class="search-more" id="search-more">More</a>' : '';
    out.innerHTML = rows + more;
    var moreLink = document.getElementById('search-more');
    if (moreLink) {
      moreLink.addEventListener('click', function(ev){
        ev.preventDefault();
        shown += PAGE_SIZE;
        render(results, q);
      });
    }
  }

  function escapeHtml(s){
    return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function run(){
    var q = box.value;
    shown = PAGE_SIZE;
    if (!idx || q.trim().length < 2) { out.innerHTML = ''; return; }
    render(search(q), q);
  }

  box.addEventListener('input', run);
  var startQ = new URLSearchParams(location.search).get('q');
  if (startQ) box.value = startQ;

  fetch('/search-index.json').then(function(r){ return r.json(); }).then(function(data){
    idx = data;
    prepare();
    run();
    return fetch('/search-words.json').then(function(r){ return r.json(); }).then(function(words){
      if (words.v !== idx.v) return;
      text = words;
      textCache = {};
      run();
    });
  }).catch(function(){});
})();
</script>
</body>
