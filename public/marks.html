<style>
  :root {
    --ground: #14100c;
    --ink: #f4ede1;
    --muted: rgba(244,237,225,0.62);
    --hairline: rgba(244,237,225,0.18);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  header {
    padding: 4rem 2rem 2rem;
    max-width: 1400px;
    margin: 0 auto;
  }
  h1 {
    font-size: 2.25rem;
    font-weight: 500;
    margin: 0 0 0.5rem;
    display: flex;
    align-items: baseline;
    gap: 0.75rem;
    flex-wrap: wrap;
  }
  h1 .count {
    font-size: 1rem;
    font-weight: 400;
    color: var(--muted);
  }
  .subline {
    margin: 0;
    color: var(--muted);
    font-size: 0.95rem;
  }
  main {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 2rem 2rem;
  }
  .sheet {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 6px;
  }
  .tile {
    border: 1px solid var(--hairline);
    overflow: hidden;
    display: flex;
  }
  .tile img {
    width: 100%;
    height: auto;
    display: block;
  }
  footer {
    max-width: 1400px;
    margin: 0 auto;
    padding: 2rem 2rem 4rem;
    border-top: 1px solid var(--hairline);
  }
  footer p {
    margin: 1.5rem 0 0;
    color: var(--muted);
    font-size: 0.9rem;
  }
  @media (max-width: 1100px) {
    .sheet { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 600px) {
    .sheet { grid-template-columns: repeat(2, 1fr); }
    header { padding: 3rem 1.25rem 1.5rem; }
    main { padding: 0 1.25rem 1.5rem; }
    footer { padding: 1.5rem 1.25rem 3rem; }
  }
</style>
</head>
