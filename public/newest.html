e ground, and twisted wire.","date":"2026-10-10","href":"/digital/saved-pieces/made-and-found-things/0008","src":"https://media.paraploo.com/site/images/lines/made-and-found-things/20962-600.webp","w":463,"h":600},{"kind":"Essay","group":"writings","title":"The Biography Stayed While the Insights Went Out Searching","line":"Same child same black soil ... same cross at six Grandma framed and hung where she slept ... Same Ukrainian dolls holding receivers to their ears ... Same garage same wood ... same cold to warming ... Every automatic biography we ever wrote agrees on this ... the story never moved ... It was the book that couldn't sit","date":"2026-09-23","href":"/words/2026-variety/the-biography-stayed-while-the-insights-went-out-searching/"},{"kind":"Marks","group":"word-mapping","title":"Take Actions Interlood","line":"Wide pen drawings in black on white where the marks turn into words: phrases written along winding bands, packed into rows, or spelled out in bubble letters, some pages nearly black and some light.","date":"2026-09-18","href":"/marks/word-mapping/0026","src":"https://media.paraploo.com/site/images/marks/SMOOTH%20BEH%20LAYE/WORD%20MAPPING%20%2828%29/Take%20Actions%20Interlood-600.webp","w":600,"h":464},{"kind":"Placings","group":"western-nothing","title":"Western Nothing (Three)","line":"A warm dark heap of lumps, stones, bottles, a sparkling ring, and pink sheer cloth drifting over it all, photographed close.","date":"2026-09-17","href":"/physical/western-nothing/0095","src":"https://media.paraploo.com/site/images/physical/western-nothing/Woa%20Mun%20%2052D-600.webp","w":600,"h":400},{"kind":"Sentence","group":"writings","said":"We took a piece, kept its skeleton and ran with a completely different vocabulary.","title":"( testing an early morning hour )","href":"/words/2025-variety/testing-an-early-morning-hour/"},{"kind":"Collage","group":"out-and-about","title":"Out and About (One)","line":"Eleven collages of photographs taken out in the world: a big Information sign, a street parade with drums and old cars, fair rides and a food stand menu, rain on a city street, roses, rocks in the desert, and two rugby players running.","date":"2026-10-10","href":"/digital/saved-pieces/out-and-about/0011","src":"https://media.paraploo.com/site/images/lines/out-and-about/20961-600.webp","w":600,"h":373},{"kind":"Essay","group":"writings","title":"Paraploo","line":"The Reach(ing) is the Chime Beginning with Forgiveness — of the maker's work or play, of a very bad day ... All blame is set down at each next sacred passage ... What's offered is Mercy or belief that an incomplete thing still deserves a hand ... We prefer to support rather than too soon go to criticizing ... Close to","date":"2026-08-31","href":"/words/2026-variety/paraploo-the-reach-ing-is-the-chime/"},{"kind":"Marks","group":"thousand-marks","title":"Zy Zy Zy OuAawa","line":"Wide pen drawings in black on white, each page covered edge to edge in small curved marks so even that from a step back it turns a soft gray.","date":"2026-09-18","href":"/marks/thousand-marks/0069","src":"https://media.paraploo.com/site/images/marks/SMOOTH%20BEH%20LAYE/THOUSAND%20MARKS%20%2869%29/Zy%20Zy%20Zy%20OuAawa-600.webp","w":600,"h":438},{"kind":"Placings","group":"werg-and-gis-middle-labor","title":"Werg and Gis Middle Labor (One)","line":"Purple ribbon, a skull, rope, and metal in the snow, mostly in the dark.","date":"2026-09-17","href":"/physical/werg-and-gis-middle-labor/0202","src":"https://media.paraploo.com/site/images/physical/werg-and-gis-middle-labor/Guesswerg-92-600.webp","w":600,"h":501},{"kind":"Collage","group":"out-and-about","title":"Out and About (Two)","line":"Eleven collages of photographs taken out in the world: a big Information sign, a street parade with drums and old cars, fair rides and a food stand menu, rain on a city street, roses, rocks in the desert, and two rugby players running.","date":"2026-10-10","href":"/digital/saved-pieces/out-and-about/001
