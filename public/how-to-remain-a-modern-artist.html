<div class="lightbox-overlay" id="lightbox">

<script>
(function() {
  var overlay = document.getElementById('lightbox');
  var img = document.getElementById('lightbox-img');
  var closeBtn = document.getElementById('lightbox-close');
  function sizeToNatural() {
    var maxW = window.innerWidth * 0.95;
    var maxH = window.innerHeight * 0.95;
    var w = Math.min(img.naturalWidth, maxW);
    var h = Math.min(img.naturalHeight, maxH);
    var scale = Math.min(w / img.naturalWidth, h / img.naturalHeight, 1);
    img.style.width = (img.naturalWidth * scale) + 'px';
    img.style.height = (img.naturalHeight * scale) + 'px';
  }
  function openItem(item) {
    img.src = item.getAttribute('data-full');
    img.alt = item.querySelector('img').alt;
    overlay.classList.add('open');
    img.onload = sizeToNatural;
  }
  function closeLightbox() {
    overlay.classList.remove('open');
    img.src = '';
  }
  document.querySelectorAll('.gallery-item').forEach(function(item) {
    item.addEventListener('click', function() { openItem(item); });
    item.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        openItem(item);
      }
    });
  });
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeLightbox();
  });
  closeBtn.addEventListener('click', closeLightbox);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) {
      closeLightbox();
    }
  });
})();
</script>
